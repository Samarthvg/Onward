<script type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"General Dynamics Mission Systems, Inc","sameAs":"https://gdmissionsystems.com/"},"validThrough":"2027-10-20T04:00:00.000Z","jobLocation":[{"address":{"addressCountry":"US","streetAddress":"9100 Ashton Avenue","@type":"PostalAddress","postalCode":"20110","addressLocality":"Manassas","addressRegion":"VA","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"employmentType":"OTHER","@type":"JobPosting","description":"<h2>Basic Qualifications <\/h2>Bachelor's degree in Software Engineering, or Engineering, Science, or Math.\n<p>&nbsp;<\/p>\n<p><strong>CLEARANCE REQUIREMENTS:<\/strong>[Department of Defense Secret security clearance is preferred at time of hire.] Applicants selected will be subject to a U.S. Government security investigation and must meet eligibility requirements for access to classified information. Due to the nature of work performed within our facilities, U.S. citizenship is required.<\/p>\n<h2>Responsibilities for this Position<\/h2>\n<p>General Dynamics Mission Systems is seeking an entry-level Software Engineer to support the Tactical Control System (TCS) Program. In this role, you will contribute to the development, integration, testing, and maintenance of software supporting mission-critical capabilities. You will work alongside experienced engineers to solve technical problems, build reliable software, and grow your skills in a collaborative team environment.<\/p>\n<h2>Key Responsibilities<\/h2>\n<ul>\n <li>Develop and maintain software using <strong>C++ and Java<\/strong> in a <strong>Linux<\/strong> environment.<\/li>\n <li>Participate in software design, implementation, code reviews, and testing.<\/li>\n <li>Troubleshoot software issues and support integration and defect resolution.<\/li>\n <li>Develop unit tests and maintain technical documentation.<\/li>\n <li>Collaborate with software, systems, and test engineers to implement and verify requirements.<\/li>\n <li>Learn and apply team coding standards, development tools, and software engineering practices.<\/li>\n<\/ul>\n<h2>Required Qualifications<\/h2>\n<ul>\n <li>Bachelor\u2019s degree in Software Engineering, Computer Science, Computer Engineering, or a related technical field, or equivalent relevant experience.<\/li>\n <li>Foundational programming experience with <strong>C++ and Java<\/strong>, demonstrated through coursework, personal projects, internships, or professional experience.<\/li>\n <li>Familiarity with <strong>Linux<\/strong>, including command-line tools and basic development workflows.<\/li>\n <li>Understanding of object-oriented programming, data structures, and software debugging.<\/li>\n <li>Strong problem-solving skills and a willingness to learn.<\/li>\n <li>Ability to communicate effectively and work collaboratively.<\/li>\n<\/ul>\n<h2>Preferred Qualifications<\/h2>\n<p>Experience or familiarity with one or more of the following:<\/p>\n<ul>\n <li><strong>JavaScript<\/strong> for web application development.<\/li>\n <li><strong>Python or Bash<\/strong> for scripting and automation.<\/li>\n <li><strong>Docker<\/strong> for containerized development and deployment.<\/li>\n <li><strong>Kubernetes<\/strong> for container orchestration.<\/li>\n <li><strong>Spring Boot<\/strong> for Java-based application and service development.<\/li>\n <li>Git or other version-control tools.<\/li>\n <li>Automated testing and continuous integration/continuous delivery (CI/CD) practices.<\/li>\n<\/ul>\n<h2>Experience Level<\/h2>\n<p>Entry level. Relevant academic projects, internships, and personal software projects are encouraged. Candidates are not expected to have experience with every preferred technology.<\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Workplace Options:<\/strong>This position is on site, with options for hybrid work after the first three months of onboarding.&nbsp;While on-site, you will be a part of the GDMS Progreny (9100 Ashton Avenue) facility in Manassas, VA.<\/p>\n<p>&nbsp;<\/p>\n<h2>Salary Note<\/h2>This estimate represents the typical salary range for this position based on experience and other factors (geographic location, etc.). Actual pay may vary. This job posting will remain open until the position is filled.\n<h2>Combined Salary Range<\/h2>USD $77,843.00 - USD $86,358.00 /Yr.\n<h2>Company Overview<\/h2>\n<p>General Dynamics Mission Systems (GDMS) engineers a diverse portfolio of high technology solutions, products and services that enable customers to successfully execute missions across all domains of operation. With a global team of 12,000+ top professionals, we partner with the best in industry to expand the bounds of innovation in the defense and scientific arenas. Given the nature of our work and who we are, we value trust, honesty, alignment and transparency. We offer highly competitive benefits and pride ourselves in being a great place to work with a shared sense of purpose. You will also enjoy a flexible work environment where contributions are recognized and rewarded. If who we are and what we do resonates with you, we invite you to join our high-performance team!<\/p>\n<p>Equal Opportunity Employer / Individuals with Disabilities / Protected Veterans<\/p>","directApply":true,"datePosted":"2026-10-20T04:00:00.000Z","title":"Entry Level Software Engineer (Spring 2027)","occupationalCategory":"Engineering-RF","@context":"http://schema.org","url":"https://careers-gdms.icims.com/jobs/75608/entry-level-software-engineer-%28spring-2027%29/job"}</script>
