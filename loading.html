<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onward</title>
<!-- What the app's window shows while it starts (as a splash, before the
     helper answers), and what the helper serves while the dashboard is being
     rebuilt (after an update). Served by the helper, it asks /api/render how
     far the rebuild is and opens the dashboard when it's ready. -->
<style>
  :root { --bg: #f5ecdd; --surface: #fffaf3; --text: #2b1b14; --muted: #6b5646; --line: #e7d9c5;
          --accent: #a24a1a; --track: #efe3d2; --warn: #a3261c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #150c0c; --surface: #1f1512; --text: #f2e7d9; --muted: #b9a594; --line: #3a2a22;
            --accent: #e3a467; --track: #2c1f19; --warn: #ff9c87; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; place-items: center; padding: 16px; }
  .card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
          padding: 28px 28px 24px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; margin-bottom: 18px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .status { color: var(--muted); margin: 0 0 16px; min-height: 1.5em; }
  .bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width .3s ease; }
  /* Until there's a count to show, the bar moves on its own. */
  .bar.waiting .fill { width: 35%; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
  @media (prefers-reduced-motion: reduce) { .bar.waiting .fill { animation: none; width: 100%; opacity: .5; } }
  .error { color: var(--warn); margin: 14px 0 0; font-size: 14px; }
</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#b8561f"/><path d="M33 38h61M33 63.5h61M33 89h33" fill="none" stroke="#fbf1e4" stroke-width="10" stroke-linecap="round"/></svg>
      Onward
    </div>
    <h1 id="title">Starting Onward…</h1>
    <p class="status" id="status">This takes a few seconds.</p>
    <div class="bar waiting" id="bar" role="progressbar" aria-labelledby="title" aria-valuemin="0" aria-valuemax="100">
      <div class="fill" id="fill"></div>
    </div>
    <p class="error" id="error" hidden></p>
  </main>
<script>
  const $ = (id) => document.getElementById(id);
  // The window's splash calls this too, from the app, before the helper answers.
  window.onwardProgress = function (p) {
    if (p.error) {
      $("title").textContent = "The dashboard couldn't be built";
      $("status").textContent = "Onward is still running. Quit it from the tray icon and start it again.";
      $("error").hidden = false;
      $("error").textContent = p.error;
      return;
    }
    const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
    $("title").textContent = p.total ? "Getting your dashboard ready" : "Starting Onward…";
    $("status").textContent = p.total
      ? `${p.phase} · ${p.done.toLocaleString()} of ${p.total.toLocaleString()}`
      : (p.phase && p.phase !== "Starting" ? p.phase : "This takes a few seconds.");
    $("bar").classList.toggle("waiting", !p.total);
    $("fill").style.width = p.total ? Math.max(4, pct) + "%" : "";
    if (p.total) $("bar").setAttribute("aria-valuenow", String(pct)); else $("bar").removeAttribute("aria-valuenow");
  };
  if (location.protocol.startsWith("http")) {
    // Served by the helper while it rebuilds the dashboard.
    const poll = async () => {
      try {
        const p = await (await fetch("/api/render", { cache: "no-store" })).json();
        if (p.ready) { location.reload(); return; }
        window.onwardProgress(p);
      } catch (e) { /* the helper restarting: keep waiting */ }
      setTimeout(poll, 400);
    };
    poll();
  }
</script>
</body>
</html>
